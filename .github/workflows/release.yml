name: release

# Every push to main: test, bump the patch version, tag, and publish to npm.
on:
  push:
    branches: [main]

# Never run two releases at once (avoids version-tag races).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # needed to push the version-bump commit and tag

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip the bot's own version-bump commit. (Pushes made with GITHUB_TOKEN
    # also don't retrigger workflows — this is a second line of defence.)
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # setup-node writes an .npmrc wired to NODE_AUTH_TOKEN, used by npm publish.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        run: |
          npm version patch -m "chore(release): v%s [skip ci]"

      - name: Push commit and tag
        run: git push --follow-tags origin HEAD:main

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
